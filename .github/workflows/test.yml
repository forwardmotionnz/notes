# The whole suite in both engines: Chromium, and WebKit (Safari's engine,
# which every browser on iOS uses). Nothing here talks to real GitHub; the
# tests serve the app and fake GitHub locally.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      repeat:
        description: Runs in a row (a flaky test is a failing test)
        default: "1"

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Suite in ${{ matrix.engine }}
        env:
          REPEAT: ${{ inputs.repeat || '1' }}
        run: |
          for i in $(seq 1 "$REPEAT"); do
            echo "::group::Run $i of $REPEAT"
            node tests/run.mjs ${{ matrix.engine }} || exit 1
            echo "::endgroup::"
          done
